<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
  aria-labelledby="titleUpcoming">
  <title id="titleUpcoming">Upcoming Event</title>
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6D365" />
      <stop offset="1" stop-color="#D5AB5C" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9E7B1" />
      <stop offset="1" stop-color="#B8964A" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Calendar body -->
  <rect x="3" y="5.5" width="18" height="14.5" rx="3" fill="url(#goldGrad)" opacity="0.18" />
  <rect x="3" y="5.5" width="18" height="14.5" rx="3" stroke="url(#goldStroke)" stroke-width="1.5" />
  <!-- Calendar rings -->
  <line x1="8" y1="4" x2="8" y2="7" stroke="url(#goldStroke)" stroke-width="1.5"
    stroke-linecap="round" />
  <line x1="16" y1="4" x2="16" y2="7" stroke="url(#goldStroke)" stroke-width="1.5"
    stroke-linecap="round" />
  <line x1="3" y1="9" x2="21" y2="9" stroke="url(#goldStroke)" stroke-width="1.2"
    stroke-linecap="round" opacity="0.9" />

  <!-- Clock (upcoming) -->
  <g filter="url(#softGlow)">
    <circle cx="16.5" cy="15.5" r="3.75" fill="url(#goldGrad)" opacity="0.15" />
    <circle cx="16.5" cy="15.5" r="3.75" stroke="url(#goldStroke)" stroke-width="1.5" />
    <path d="M16.5 13.8v1.9l1.4 1.05" stroke="url(#goldStroke)" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Spark (anticipation) -->
  <path d="M6.2 12.2l.7-1.6.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7Z"
    fill="url(#goldGrad)" opacity="0.55" />
</svg>