<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
  aria-labelledby="titlePassed">
  <title id="titlePassed">Passed Event</title>
  <defs>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8C1CC" />
      <stop offset="1" stop-color="#7F8A99" />
    </linearGradient>
    <linearGradient id="slateStroke" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D2D8E0" />
      <stop offset="1" stop-color="#6E7A89" />
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A80" />
      <stop offset="1" stop-color="#FF5252" />
    </linearGradient>
    <filter id="softInner" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Calendar body -->
  <rect x="3" y="5.5" width="18" height="14.5" rx="3" fill="url(#slateGrad)" opacity="0.16" />
  <rect x="3" y="5.5" width="18" height="14.5" rx="3" stroke="url(#slateStroke)" stroke-width="1.5" />
  <!-- Calendar rings -->
  <line x1="8" y1="4" x2="8" y2="7" stroke="url(#slateStroke)" stroke-width="1.5"
    stroke-linecap="round" />
  <line x1="16" y1="4" x2="16" y2="7" stroke="url(#slateStroke)" stroke-width="1.5"
    stroke-linecap="round" />
  <line x1="3" y1="9" x2="21" y2="9" stroke="url(#slateStroke)" stroke-width="1.2"
    stroke-linecap="round" opacity="0.9" />

  <!-- Check badge (passed) -->
  <g filter="url(#softInner)">
    <circle cx="16.5" cy="15.5" r="3.75" fill="url(#sunset)" opacity="0.20" />
    <circle cx="16.5" cy="15.5" r="3.75" stroke="url(#sunset)" stroke-width="1.5" />
    <path d="M14.9 15.6l1.1 1.1 2.4-2.6" stroke="white" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round" />
  </g>

  <!-- Subtle “done” tick marks -->
  <path d="M6 12h2M6 14h3M6 16h2.5" stroke="url(#slateStroke)" stroke-width="1.2"
    stroke-linecap="round" opacity="0.8" />
</svg>