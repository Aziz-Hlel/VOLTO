  db:
    image: postgres:15
    restart: no
    env_file:
      - ${PROJECT_ROOT}/config/.env.dev
      - ${PROJECT_ROOT}/.env.local
      - ${PROJECT_ROOT}/.env

    ports:
      - 9999:5432

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} "] # ? make variables dynamic
      interval: 5s
      retries: 10
      timeout: 5s

    volumes:
      - db_dev_volume:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: no
    ports:
      - 6379:6379

    volumes:
      - redis_dev_volume:/data

    command: ["redis-server", "--appendonly", "yes"] # enables persistence

  minio:
    image: quay.io/minio/minio:latest
    restart: no
    ports:
      - "${MINIO_PORT:-9000}:${MINIO_PORT:-9000}" # S3 API
      - 9001:9001 # Web UI

    env_file:
      - ${PROJECT_ROOT}/config/.env.dev
      - ${PROJECT_ROOT}/.env.local
      - ${PROJECT_ROOT}/.env

    volumes:
      - minio_dev_volume:/data

    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc
    restart: no
    depends_on:
      minio:
        condition: service_started

    env_file:
      - ${PROJECT_ROOT}/config/.env.dev
      - ${PROJECT_ROOT}/.env.local
      - ${PROJECT_ROOT}/.env

    volumes:
      - ${PROJECT_ROOT}/apps/api/src/seed/minio_client_seed_files:/seed # Your seed files
      - ${PROJECT_ROOT}/apps/api/init_minio_client.sh:/init_minio_client.sh # The script

    entrypoint: ["/bin/sh", "/init_minio_client.sh"]

  mailpit:
    image: axllent/mailpit
    restart: no
    ports:
      - 8025:8025 # Web UI
      - "${SMTP_PORT:-1025}:${SMTP_PORT:-1025}"

  db-backup:
    container_name: volto-db-backup
    build:
      context: ${PROJECT_ROOT}
      dockerfile: docker/prod/Dockerfile.dbBackup.prod
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_CONTAINER_NAME: db

    volumes:
      - ${PROJECT_ROOT}/backup:/backup
    depends_on:
      db:
        condition: service_healthy
    restart: no

volumes:
  db_dev_volume:
    driver: local
  redis_dev_volume:
    driver: local
  minio_dev_volume:
    driver: local
